name: Publish Electron App

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU variant to publish (cuda, rocm, jetpack5, jetpack6, all)"
        required: false
        default: all

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      # 1. Import using your UNCHANGED original secret
      # 1. Decode, upgrade, and import using your UNCHANGED original secret
      - name: Import Apple Certificates
        run: |
          # Create paths
          mkdir -p "$RUNNER_TEMP/certs"
          OLD_P12="$RUNNER_TEMP/certs/old_cert.p12"
          NEW_P12="$RUNNER_TEMP/certs/modern_cert.p12"
          KEYCHAIN_PATH="$HOME/Library/Keychains/electron_build.keychain-db"
          
          # Decode your long-standing base64 secret into a temporary file
          echo "${{ secrets.CSC_LINK }}" | base64 --decode > "$OLD_P12"
          
          # Convert the old p12 format into a modern crypto format that macOS 27 accepts
          # We use the existing password to unpack it, and keep the exact same password for the new one
          openssl pkcs12 -in "$OLD_P12" -out "$RUNNER_TEMP/certs/temp.pem" -nodes -password pass:"${{ secrets.CSC_KEY_PASSWORD }}"
          openssl pkcs12 -export -in "$RUNNER_TEMP/certs/temp.pem" -out "$NEW_P12" -password pass:"${{ secrets.CSC_KEY_PASSWORD }}"
          
          # Create the keychain manually since we are bypassing the apple-action plugin
          security create-keychain -p "temporary-actions-password" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "temporary-actions-password" "$KEYCHAIN_PATH"
          
          # Import the newly upgraded modern p12 file
          security import "$NEW_P12" -k "$KEYCHAIN_PATH" -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/productbuild
          
          # Clean up temporary raw pem/p12 files for security
          rm -rf "$RUNNER_TEMP/certs"


      # 2. Configure partitions natively on macOS using the action's master password
      - name: Configure macOS Keychain Permissions
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/electron_build.keychain-db"
          
          # Prevent the keychain from locking itself mid-build
          security set-keychain-settings -u "$KEYCHAIN_PATH"
          
          # Natively authorize signing tools to access keys without prompts
          security set-key-partition-list -S apple-tool:,apple: -s -k "temporary-actions-password" "$KEYCHAIN_PATH"

      - name: Install dependencies
        working-directory: src
        run: npm ci && npm install -g typescript

      # 3. Direct electron-builder to the custom keychain file
      - name: Build and publish CPU Electron app (macOS ARM)
        working-directory: src
        env:
          CSC_KEYCHAIN: "$HOME/Library/Keychains/electron_build.keychain-db"
          CSC_KEY_PASSWORD: "temporary-actions-password"  # Must match keychain-password above
        run: npm run publish

      - name: Verify macOS identity
        working-directory: src
        run: |
          ditto -x -k dist/*.zip dist/unzipped
          codesign -vvv --strict dist/unzipped/*.app

  build-macos-x86:
    runs-on: macos-15-intel
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: src
        run: npm ci && npm install -g typescript

      - name: Build and publish CPU Electron app (macOS x86)
        working-directory: src
        run: npm run publish

      - name: Verify macOS identity
        working-directory: src
        run: |
          ditto -x -k dist/*.zip dist/unzipped
          codesign -vvv --strict dist/unzipped/*.app

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-windows-arm:
    runs-on: windows-11-arm
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-windows-cuda:
    if: ${{ github.event.inputs.gpu == 'cuda' || github.event.inputs.gpu == 'all' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "cuda"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-linux-cuda:
    if: ${{ github.event.inputs.gpu == 'cuda' || github.event.inputs.gpu == 'all' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "cuda"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src
  build-windows-rocm:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "rocm"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src
  build-linux-rocm:
    if: ${{ github.event.inputs.gpu == 'rocm' || github.event.inputs.gpu == 'all' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "rocm"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src
  build-linux-arm-cuda:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "cuda"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-linux-jetpack5:
    if: ${{ github.event.inputs.gpu == 'jetpack5' || github.event.inputs.gpu == 'all' }}
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "jetpack5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src

  build-linux-jetpack6:
    if: ${{ github.event.inputs.gpu == 'jetpack6' || github.event.inputs.gpu == 'all' }}
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OLLAMA_ACCELERATION: "jetpack6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci && npm install -g typescript
        working-directory: src
      - run: npm run publish
        working-directory: src
